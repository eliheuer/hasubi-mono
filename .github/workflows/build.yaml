name: Build and check fonts

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv/bin/designbot
            .venv/.crates.toml
            .venv/.crates2.json
          key: designbot-build-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install the fontconfig headers that DesignBot needs to compile
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - run: make setup
      - run: make build
      - run: make test NO_BUILD=1
        env:
          QA_OPTIONS: ${{ github.event_name == 'release' && '--require-online' || '' }}
      - run: make proof NO_BUILD=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fonts-and-qa
          path: |
            fonts/
            output/qa/
            output/proof/
      - name: Assemble proof and QA site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: make collect-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: output/site
      - name: Package release fonts
        if: github.event_name == 'release'
        run: zip -qr hasubi-mono-fonts.zip fonts OFL.txt AUTHORS.txt CONTRIBUTORS.txt output/qa output/proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: release-archive
          path: hasubi-mono-fonts.zip

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Attach the tested archive to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-archive
          gh release upload "$TAG" hasubi-mono-fonts.zip --repo "$GITHUB_REPOSITORY" --clobber
